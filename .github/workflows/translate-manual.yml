name: Prepare English repair manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ctranslate2==4.6.0 sentencepiece==0.2.1
      - run: python scripts/manual/translate.py prepare
      - run: python scripts/manual/translate.py translate --shard ${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@v4
        with:
          name: manual-translation-${{ matrix.shard }}
          path: .cache/manual-translation/translations-*.json
          include-hidden-files: true
          retention-days: 7

  assemble:
    needs: translate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: manual-translation-*
          path: .cache/manual-translation
          merge-multiple: true
      - run: python scripts/manual/translate.py prepare && python scripts/manual/translate.py assemble
      - run: node scripts/manual/check-locales.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: english-manual
          path: public/manual/en
          retention-days: 7
