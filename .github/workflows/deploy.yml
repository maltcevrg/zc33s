name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/01a10a17-zc33s
      - arena/183191ef-zc33s
      - arena/0670a8b3-zc33s

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
